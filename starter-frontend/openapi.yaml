openapi: 3.0.3
info:
  title: Starter API
  version: 1.0.0
paths:
  /api/lang/:
    get:
      operationId: lang_list
      description: |
        Liste paginée des langues.

        Supporte :
        - `search` (DRF SearchFilter sur `code`, `name`)
        - `ordering` (DRF OrderingFilter sur `code`, `name`, `id`)
      summary: Lister les langues
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Tri (ex: "code", "-name", "id").'
      - in: query
        name: page
        schema:
          type: integer
        description: Numéro de page (si pagination activée).
      - in: query
        name: page_size
        schema:
          type: integer
        description: Taille de page (si PageNumberPagination configurée).
      - in: query
        name: search
        schema:
          type: string
        description: Recherche simple sur code/name.
      tags:
      - Language
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLanguageReadList'
          description: ''
    post:
      operationId: lang_create
      summary: Créer une langue
      tags:
      - Language
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LanguageWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LanguageWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageRead'
          description: ''
        '400':
          description: Validation error
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden (admin only)
  /api/lang/{lang_id}/:
    get:
      operationId: lang_retrieve
      summary: Récupérer une langue
      parameters:
      - in: path
        name: lang_id
        schema:
          type: integer
        description: ID de la langue.
        required: true
      tags:
      - Language
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageRead'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found
    put:
      operationId: lang_update
      summary: Mettre à jour une langue (PUT)
      parameters:
      - in: path
        name: lang_id
        schema:
          type: integer
        description: ID de la langue.
        required: true
      tags:
      - Language
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LanguageWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LanguageWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageRead'
          description: ''
        '400':
          description: Validation error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden (admin only)
    patch:
      operationId: lang_partial_update
      summary: Mettre à jour une langue (PATCH)
      parameters:
      - in: path
        name: lang_id
        schema:
          type: integer
        description: ID de la langue.
        required: true
      tags:
      - Language
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLanguagePartialRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLanguagePartialRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLanguagePartialRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageRead'
          description: ''
        '400':
          description: Validation error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden (admin only)
    delete:
      operationId: lang_destroy
      summary: Supprimer une langue
      parameters:
      - in: path
        name: lang_id
        schema:
          type: integer
        description: ID de la langue.
        required: true
      tags:
      - Language
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No Content
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden (admin only)
  /api/mail/test/:
    post:
      operationId: mail_test_create
      description: Enfile un email texte brut dans l'outbox applicative puis declenche
        la livraison via le flux email standard.
      summary: Envoyer un email de test
      tags:
      - Mail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestEmailRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TestEmailRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TestEmailRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEmailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Validation error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden (admin only)
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - es
          - fr
          - it
          - nl
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailConfirmedTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailConfirmedTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailConfirmedTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPairResponse'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/translate/batch/:
    post:
      operationId: translate_batch_create
      description: Traduit une liste d'éléments en une seule requête. Chaque item
        peut être en `format=text` ou `format=html`. Les entrées vides sont ignorées
        (pas d'appel DeepL), donc elles peuvent ne pas apparaître dans la map `translations`.
      summary: Traduction batch (DeepL) - texte et HTML
      tags:
      - Translation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslateBatchRequestRequest'
            examples:
              RequestExample(mixedText/html):
                value:
                  source: fr
                  target: nl
                  items:
                  - key: name.fr
                    text: Natation
                    format: text
                  - key: desc.fr
                    text: <p>Sport aquatique</p>
                    format: html
                  - key: empty_html
                    text: <p><br></p>
                    format: html
                  - key: empty_text
                    text: '   '
                    format: text
                summary: Exemple de requête avec items texte et HTML
                description: Le backend groupe les items par format et fait 1 appel
                  DeepL par format.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TranslateBatchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TranslateBatchRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslateBatchResponse'
              examples:
                ResponseExample:
                  value:
                    translations:
                      name.fr: Zwemmen
                      desc.fr: <p>Watersport</p>
                  summary: Exemple de réponse
                  description: La réponse est une map `key -> traduction`. Les items
                    vides ignorés ne sont pas renvoyés.
          description: ''
        '400':
          description: Validation error (payload invalide)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '502':
          description: DeepL upstream error
  /api/user/:
    get:
      operationId: user_list
      description: Superuser uniquement.
      summary: Lister les utilisateurs
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - User
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomUserReadList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden (admin only)
    post:
      operationId: user_create
      description: Création ouverte (AllowAny).
      summary: Créer un utilisateur
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomUserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomUserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomUserCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUserRead'
          description: ''
        '400':
          description: Validation error
  /api/user/{user_id}/:
    get:
      operationId: user_retrieve
      summary: Récupérer un utilisateur
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - User
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUserRead'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found
    put:
      operationId: user_update
      summary: Mettre à jour un utilisateur (PUT)
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomUserAdminUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomUserAdminUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomUserAdminUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUserRead'
          description: ''
    patch:
      operationId: user_partial_update
      summary: Mettre à jour un utilisateur (PATCH)
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomUserAdminUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomUserAdminUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomUserAdminUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUserRead'
          description: ''
    delete:
      operationId: user_destroy
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - user
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/user/email/confirm/:
    post:
      operationId: user_email_confirm_create
      summary: Confirmer une adresse email
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailConfirmationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailConfirmationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailConfirmationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetOK'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Lien invalide / token invalide
  /api/user/me/:
    get:
      operationId: user_me_retrieve
      summary: Récupérer et mettre à jour mon profil
      tags:
      - User
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUserRead'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Validation error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden
    patch:
      operationId: user_me_partial_update
      summary: Récupérer et mettre à jour mon profil
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomUserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomUserProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomUserProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUserRead'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Validation error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden
  /api/user/password/change/:
    post:
      operationId: user_password_change_create
      description: Utilisateur authentifié uniquement.
      summary: Changer son mot de passe
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetOK'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Ancien mot de passe incorrect / validation
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Unauthorized
  /api/user/password/reset/:
    post:
      operationId: user_password_reset_create
      description: |-
        Envoie un email avec un lien de réinitialisation.
        Répond toujours 200 pour ne pas révéler si l'email existe.
      summary: Demander un reset de mot de passe
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetOK'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Validation error
  /api/user/password/reset/confirm/:
    post:
      operationId: user_password_reset_confirm_create
      summary: Confirmer un reset de mot de passe
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetOK'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Lien invalide / token invalide
components:
  schemas:
    CustomUserAdminUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        language:
          $ref: '#/components/schemas/LanguageEnum'
        password:
          type: string
          writeOnly: true
          minLength: 1
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        email_confirmed:
          type: boolean
        password_change_required:
          type: boolean
    CustomUserCreateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          nullable: true
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
        language:
          $ref: '#/components/schemas/LanguageEnum'
      required:
      - password
      - username
    CustomUserRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          nullable: true
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        language:
          $ref: '#/components/schemas/LanguageEnum'
        email_confirmed:
          type: boolean
          readOnly: true
        password_change_required:
          type: boolean
          readOnly: true
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
      required:
      - email_confirmed
      - id
      - is_active
      - is_staff
      - is_superuser
      - password_change_required
      - username
    EmailConfirmationRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
      required:
      - token
      - uid
    EmailConfirmedTokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
    FormatEnum:
      enum:
      - text
      - html
      type: string
      description: |-
        * `text` - text
        * `html` - html
    LanguageEnum:
      enum:
      - en
      - fr
      - nl
      - it
      - es
      type: string
      description: |-
        * `en` - English
        * `fr` - French
        * `nl` - Dutch
        * `it` - Italy
        * `es` - Spain
    LanguageRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
          description: 'Code ISO (ex: fr, nl, en, fr-BE)'
        name:
          type: string
          readOnly: true
          description: 'Nom lisible (ex: Français, Nederlands, English)'
        active:
          type: boolean
          readOnly: true
          description: Langue disponible pour la saisie et l'affichage
      required:
      - active
      - code
      - id
      - name
    LanguageWriteRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: 'Code ISO (ex: fr, nl, en, fr-BE)'
          maxLength: 10
        name:
          type: string
          minLength: 1
          description: 'Nom lisible (ex: Français, Nederlands, English)'
          maxLength: 100
        active:
          type: boolean
          description: Langue disponible pour la saisie et l'affichage
      required:
      - code
      - name
    PaginatedCustomUserReadList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CustomUserRead'
    PaginatedLanguageReadList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/LanguageRead'
    PasswordChangeRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - old_password
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        new_password1:
          type: string
          writeOnly: true
          minLength: 1
        new_password2:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password1
      - new_password2
      - token
      - uid
    PasswordResetOK:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PatchedCustomUserAdminUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        language:
          $ref: '#/components/schemas/LanguageEnum'
        password:
          type: string
          writeOnly: true
          minLength: 1
