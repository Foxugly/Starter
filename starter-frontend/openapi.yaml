          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        email_confirmed:
          type: boolean
        password_change_required:
          type: boolean
    PatchedCustomUserProfileUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
