# Apache site for Starter
# `setup.sh` replaces YOUR_DOMAIN; certbot --apache may rewrite the SSL block.
#
# Paths follow the model used by setup.sh / redeploy.sh / starter-gunicorn.service:
#   /var/www/django_websites/Starter/starter-server/...
#   /var/www/django_websites/Starter/starter-frontend/dist/starter-frontend/browser/

<VirtualHost *:80>
    ServerName YOUR_DOMAIN
    # Redirect HTTP -> HTTPS (active after certbot setup)
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName YOUR_DOMAIN

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem

    # --- Security headers ---
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # --- Frontend (Angular static build) ---
    DocumentRoot /var/www/django_websites/Starter/starter-frontend/dist/starter-frontend/browser
    <Directory /var/www/django_websites/Starter/starter-frontend/dist/starter-frontend/browser>
        Require all granted
        FallbackResource /index.html
    </Directory>

    # --- Backend (proxy to gunicorn) ---
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass /api/    http://127.0.0.1:8000/api/
    ProxyPassReverse /api/    http://127.0.0.1:8000/api/
    ProxyPass /admin/  http://127.0.0.1:8000/admin/
    ProxyPassReverse /admin/  http://127.0.0.1:8000/admin/
    ProxyPass /health/ http://127.0.0.1:8000/health/
    ProxyPassReverse /health/ http://127.0.0.1:8000/health/

    # --- Backend static & media ---
    Alias /static/ /var/www/django_websites/Starter/starter-server/staticfiles/
    <Directory /var/www/django_websites/Starter/starter-server/staticfiles>
        Require all granted
    </Directory>

    Alias /media/ /var/www/django_websites/Starter/starter-server/media/
    <Directory /var/www/django_websites/Starter/starter-server/media>
        Require all granted
    </Directory>
</VirtualHost>
