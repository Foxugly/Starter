# nginx site for Starter
# `setup.sh` replaces YOUR_DOMAIN; certbot --nginx will refresh the
# `ssl_certificate*` paths after the first run.
#
# Paths follow the model used by setup.sh / redeploy.sh / starter-gunicorn.service:
#   /var/www/django_websites/Starter/starter-server/...
#   /var/www/django_websites/Starter/starter-frontend/dist/starter-frontend/browser/

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # ACME http-01 challenge passes through; everything else upgrades to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;

    client_max_body_size 20M;

    # --- Frontend (Angular static build) ---
    root /var/www/django_websites/Starter/starter-frontend/dist/starter-frontend/browser;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset files: cache aggressively.
    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Backend (gunicorn at 127.0.0.1:8000) ---
    location ~ ^/(api|admin|health)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django admin/static & media ---
    location /static/ {
        alias /var/www/django_websites/Starter/starter-server/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/django_websites/Starter/starter-server/media/;
    }
}
